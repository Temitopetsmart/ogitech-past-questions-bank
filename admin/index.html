<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Admin demo | Past Questions Bank</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/pages.css" />
    <link rel="stylesheet" href="../assets/css/admin.css" />
  </head>
  <body>
    <div id="gate" class="gate" hidden>
      <div class="gate-box">
        <p class="badge-demo">Prototype</p>
        <h1>Demo access</h1>
        <p>
          This is a presentation prototype. There is
          <strong>no real login and no password</strong>, and this area is
          <strong>not protected</strong>. Changes are saved only in this
          browser.
        </p>
        <button type="button" class="btn" id="enter">Open admin demo</button>
        <p class="muted"><a href="../index.html">Back to the public site</a></p>
      </div>
    </div>
    <div id="app" hidden>
      <header class="admin-top">
        <strong>Past Questions Bank admin</strong>
        <span class="badge-demo">Prototype, local data only</span>
        <a href="../index.html" class="admin-link">View public site</a>
      </header>
      <nav id="anav" class="anav" aria-label="Admin sections"></nav>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
      <main id="view" class="wrap aview" tabindex="-1"></main>
    </div>
    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/validation.js"></script>
    <script src="../assets/js/admin-core.js"></script>
    <script src="../assets/js/admin-settings.js"></script>
    <script src="../assets/js/admin-hero.js"></script>
    <script src="../assets/js/admin-questions.js"></script>
    <script src="../assets/js/admin-departments.js"></script>
    <script src="../assets/js/admin-content.js"></script>
    <script src="../assets/js/admin-layout.js"></script>
    <script src="../assets/js/admin-data.js"></script>
  </body>
</html>
