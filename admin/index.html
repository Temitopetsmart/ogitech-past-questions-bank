<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#08441f" />
    <title>Administration | OGITECH Past Questions Bank</title>

    <link rel="icon" href="../assets/images/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="../assets/css/admin.css" />

    <script src="../assets/vendor/sweetalert2.all.min.js"></script>
    <script src="../assets/vendor/chart.umd.min.js"></script>
  </head>

  <body class="admin-body">
    <a class="skip" href="#view">Skip to admin content</a>

    <p id="boot" class="boot" role="status">
      <span class="spin" aria-hidden="true"></span> Loading…
    </p>
    <!-- Login -->
    <section id="login" class="login" hidden>
      <div class="login-card">
        <div class="login-brand">
          <img src="../assets/images/logo.png" alt="" />
          <div>
            <strong>OGITECH</strong>
            <span>Past Questions Bank</span>
          </div>
        </div>
        <h1>Administrator sign in</h1>
        <p class="muted">Sign in to manage past questions.</p>

        <form id="login-form" novalidate>
          <div class="field">
            <label for="lg-user">Username</label>
            <input
              id="lg-user"
              autocomplete="username"
              autocapitalize="off"
              spellcheck="false"
            />
          </div>
          <div class="field">
            <label for="lg-pass">Password</label>
            <div class="pass">
              <input
                id="lg-pass"
                type="password"
                autocomplete="current-password"
              />
              <button
                type="button"
                id="lg-toggle"
                class="icon-btn"
                aria-label="Show password"
              >
                <i class="fa-solid fa-eye" aria-hidden="true"></i>
              </button>
            </div>
          </div>
          <p id="lg-err" class="err" role="alert"></p>
          <button type="submit" id="lg-submit" class="btn primary block">
            <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i> Sign
            in
          </button>
        </form>

        <a class="login-back" href="../index.html"
          ><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to
          public website</a
        >
      </div>
    </section>

    <!-- App -->
    <div id="app" class="shell" hidden>
      <aside class="sidebar" id="sidebar" aria-label="Administration">
        <div class="sidebar-head">
          <a class="brand" href="#dashboard">
            <img src="../assets/images/logo.png" alt="" />
            <span
              ><strong>OGITECH</strong><small>Past Questions Bank</small></span
            >
          </a>
        </div>
        <nav id="anav" class="nav" aria-label="Admin sections"></nav>
        <div class="sidebar-foot">
          <a
            href="../index.html"
            class="public-link"
            target="_blank"
            rel="noopener"
          >
            <i
              class="fa-solid fa-arrow-up-right-from-square"
              aria-hidden="true"
            ></i>
            <span>View Public Website</span>
          </a>
          <div class="user-card">
            <span class="avatar" id="user-initial" aria-hidden="true">A</span>
            <span class="user-meta"
              ><strong id="user-name">Admin</strong
              ><small id="user-role"></small
            ></span>
            <button
              type="button"
              id="logout"
              class="icon-btn"
              aria-label="Sign out"
              title="Sign out"
            >
              <i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i>
            </button>
          </div>
        </div>
      </aside>
      <div class="backdrop" id="backdrop" hidden></div>

      <div class="main">
        <header class="topbar">
          <button
            type="button"
            class="icon-btn menu-btn"
            id="menu-btn"
            aria-label="Open navigation"
            aria-controls="sidebar"
            aria-expanded="false"
          >
            <i class="fa-solid fa-bars" aria-hidden="true"></i>
          </button>
          <strong id="page-title" class="topbar-title">Dashboard</strong>
          <a
            href="../index.html"
            class="icon-btn"
            target="_blank"
            rel="noopener"
            aria-label="View Public Website"
            title="View Public Website"
          >
            <i class="fa-solid fa-globe" aria-hidden="true"></i>
          </a>
        </header>

        <main id="view" class="content" tabindex="-1">
          <p class="loading">
            <span class="spin" aria-hidden="true"></span> Loading…
          </p>
        </main>
      </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/validation.js"></script>
    <script src="../assets/js/admin-core.js"></script>
    <script src="../assets/js/admin-dashboard.js"></script>
    <script src="../assets/js/admin-questions.js"></script>
    <script src="../assets/js/admin-calendars.js"></script>
    <script src="../assets/js/admin-requests.js"></script>
    <script src="../assets/js/admin-departments.js"></script>
    <script src="../assets/js/admin-academic.js"></script>
    <script src="../assets/js/admin-accounts.js"></script>
    <script src="../assets/js/admin-leadership.js"></script>
    <script src="../assets/js/admin-committee.js"></script>
    <script src="../assets/js/admin-hotlines.js"></script>
  </body>
</html>
