<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#08441f" />
    <title>Administration | OGITECH Past Questions Bank</title>

    <link rel="icon" href="../assets/images/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />

    <!-- Shared platform libraries -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/pages.css" />
    <link rel="stylesheet" href="../assets/css/admin.css" />

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>

  <body class="admin-body">
    <a class="skip" href="#view">Skip to admin content</a>

    <div id="app" class="admin-app">
      <aside class="admin-sidebar" id="admin-sidebar">
        <a class="admin-brand" href="#dashboard" aria-label="Admin dashboard">
          <img
            src="../assets/images/logo.png"
            alt=""
            class="admin-brand-logo"
            onerror="this.style.display = 'none'"
          />
          <span class="admin-brand-copy">
            <strong>OGITECH</strong>
            <span>Past Questions Bank</span>
            <small>ADMINISTRATION</small>
          </span>
        </a>

        <div class="sidebar-divider"></div>

        <nav id="anav" class="admin-nav" aria-label="Admin sections"></nav>

        <div class="sidebar-bottom">
          <a href="../index.html" class="sidebar-public-link">
            <i
              class="fa-solid fa-arrow-up-right-from-square"
              aria-hidden="true"
            ></i>
            <span>View public website</span>
          </a>
          <div class="sidebar-status">
            <span class="status-dot" aria-hidden="true"></span>
            <span>Content management</span>
          </div>
        </div>
      </aside>

      <div class="admin-main">
        <header class="admin-topbar">
          <button
            type="button"
            class="admin-menu-toggle"
            id="admin-menu-toggle"
            aria-label="Open navigation"
            aria-controls="admin-sidebar"
            aria-expanded="false"
          >
            <i class="fa-solid fa-bars" aria-hidden="true"></i>
          </button>

          <div class="admin-topbar-title">
            <span class="admin-topbar-eyebrow"
              >OGITECH PAST QUESTIONS BANK</span
            >
            <strong id="admin-page-title">Dashboard</strong>
          </div>

          <a href="../index.html" class="admin-topbar-public">
            <i class="fa-solid fa-globe" aria-hidden="true"></i>
            <span>Public site</span>
          </a>
        </header>

        <div
          id="admin-sidebar-backdrop"
          class="admin-sidebar-backdrop"
          hidden
        ></div>

        <div id="toast" class="toast" role="status" aria-live="polite"></div>

        <main id="view" class="admin-content" tabindex="-1"></main>

        <footer class="admin-footer">
          <span>OGITECH Past Questions Bank</span>
          <span>Content Management</span>
        </footer>
      </div>
    </div>

    <script src="../assets/js/store.js"></script>
    <script src="../assets/js/validation.js"></script>
    <script src="../assets/js/admin-core.js"></script>
    <script src="../assets/js/admin-settings.js"></script>
    <script src="../assets/js/admin-hero.js"></script>
    <script src="../assets/js/admin-questions.js"></script>
    <script src="../assets/js/admin-departments.js"></script>
    <script src="../assets/js/admin-content.js"></script>
    <script src="../assets/js/admin-layout.js"></script>
    <script src="../assets/js/admin-data.js"></script>
  </body>
</html>
