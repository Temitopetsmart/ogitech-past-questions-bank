<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="View and download OGITECH academic calendars."
    />
    <title>Academic Calendar | OGITECH Past Questions Bank</title>
    <link rel="icon" href="assets/images/logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/pages.css" />
  </head>

  <body data-page="calendar" data-title="Academic Calendar">
    <a class="skip" href="#main">Skip to content</a>
    <header class="site-header" id="header"></header>

    <main id="main" class="wrap">
      <div id="storage-note"></div>

      <section class="page-head">
        <h1>Academic Calendar</h1>
        <p class="muted">
          View and download official academic calendar documents for OGITECH.
        </p>
      </section>

      <section class="results-section" aria-labelledby="calendar-heading">
        <div class="results-heading">
          <div>
            <h2 id="calendar-heading">Available calendars</h2>
            <p
              class="muted"
              id="calendar-count"
              role="status"
              aria-live="polite"
            >
              Loading academic calendars…
            </p>
          </div>
        </div>
        <div id="calendar-list" aria-live="polite"></div>
      </section>
    </main>

    <footer class="site-footer" id="footer"></footer>

    <script src="assets/js/store.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/calendars.js"></script>
  </body>
</html>
